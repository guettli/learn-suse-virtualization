name: handsfree_anki
description: "Hands-free voice-controlled flashcard app for Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  flutter_background_service: ^5.0.10
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.5
  flutter_markdown: ^0.7.6+1
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards.json
    - assets/app_icon.png
